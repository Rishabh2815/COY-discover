# Edge load balancer + coarse traffic control in front of N app containers.
# Mount as /etc/nginx/conf.d/default.conf. The app does the precise per-route limiting; this layer
# absorbs floods before they reach Node.

limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=swipe:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream coy_app {
    least_conn;                                  # send each request to the least busy instance
    server app:3000 max_fails=3 fail_timeout=10s; # compose DNS returns every replica; failed ones are skipped
    keepalive 32;
}

server {
    listen 80;

    # Request-size and time bounds
    client_max_body_size   2k;
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           15s;
    keepalive_timeout      60s;                  # app keepAliveTimeout (65s) is deliberately higher

    # Traffic control
    limit_conn        perip 30;
    limit_conn_status 429;
    limit_req_status  429;

    # Proxy defaults (inherited by every location below)
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;
    proxy_next_upstream   error timeout http_502 http_503;  # retries safe (idempotent) requests only
    proxy_next_upstream_tries 2;

    location = /api/swipe { limit_req zone=swipe burst=10 nodelay; proxy_pass http://coy_app; }
    location /api/        { limit_req zone=api   burst=40 nodelay; proxy_pass http://coy_app; }
    location /            { proxy_pass http://coy_app; }
}
