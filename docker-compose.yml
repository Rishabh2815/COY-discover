# Single-host scale-out: nginx -> 3 app containers, each running WEB_CONCURRENCY workers.
# All containers share one named volume, so SQLite (WAL) and the rate-limit store are shared.
# Multi-HOST scale-out needs a network database (Postgres) and Redis; SQLite cannot be shared over a network.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      WEB_CONCURRENCY: "2"
      TRUST_PROXY_HOPS: "1"          # nginx is the one trusted proxy in front
      DAILY_SWIPE_LIMIT: "500"
    volumes: [coydata:/data]
    deploy: { replicas: 3 }
    stop_grace_period: 20s            # > server.mjs drain window
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
volumes:
  coydata:
