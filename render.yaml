services:
  - type: web
    name: coy-discover
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: coy-discover-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/coy.db
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRUST_PROXY_HOPS
        value: "1"
